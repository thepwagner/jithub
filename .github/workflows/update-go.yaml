name: Dependency Updates
on:
  workflow_dispatch:
  pull_request:
    types: [reopened]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        go-version: '1.15.0'  # or whatever version you use
    - uses: thepwagner/action-update-go@main
